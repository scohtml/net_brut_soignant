<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brut → net IDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E9EDED; --surface:#FFFFFF; --ink:#17252A; --muted:#5C6B70; --line:#D3DBDB;
  --accent:#0E6E6E; --accent-soft:#E1EFEE; --field:#F4F7F7;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
:root.lucratif{ --accent:#9A5F12; --accent-soft:#F6ECD9; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#101819; --surface:#182324; --ink:#E4ECEC; --muted:#93A4A6; --line:#2A3839;
    --accent:#4FB3AE; --accent-soft:#1C3534; --field:#1F2C2D;
  }
  :root.lucratif:not([data-theme="light"]){ --accent:#E0A659; --accent-soft:#3A2D1A; }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#101819; --surface:#182324; --ink:#E4ECEC; --muted:#93A4A6; --line:#2A3839;
  --accent:#4FB3AE; --accent-soft:#1C3534; --field:#1F2C2D;
}
:root[data-theme="dark"].lucratif{ --accent:#E0A659; --accent-soft:#3A2D1A; }

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.title{font-size:15px;font-weight:600;letter-spacing:.02em;margin:0}
.formula{font-family:var(--mono);font-size:11px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{font:500 13px var(--sans);padding:10px 8px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;cursor:pointer;line-height:1.25}
.seg button small{display:block;font:400 11px var(--mono);color:var(--muted);margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.seg button[aria-pressed="true"] small{color:var(--surface);opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input{font:500 17px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font:400 11px var(--mono);letter-spacing:0;text-transform:none;color:var(--muted)}
.nets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.net{background:var(--accent-soft);border-radius:10px;padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.net .k{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.net .v{font:600 26px var(--mono);font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
.net .s{font:400 11px var(--mono);color:var(--muted)}
.net.main{outline:2px solid var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap;padding-left:10px}
td .d{display:block;font:400 11px var(--mono);color:var(--muted);margin-top:2px}
tr.tot td{border-bottom:none;font-weight:600;padding-top:10px}
tr.tot td:last-child{color:var(--accent);font-size:15px}
details summary{cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
details[open] summary{margin-bottom:12px}
.note{font-size:11.5px;line-height:1.5;color:var(--muted);margin:0}
.reset{font:500 12px var(--sans);background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 10px;cursor:pointer;margin-top:12px}
@media (max-width:360px){.net .v{font-size:22px}}
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <h1 class="title">Brut → net IDE</h1>
    <span class="formula" id="fx">CCN 51</span>
  </div>

  <div class="panel">
    <div class="seg" role="group" aria-label="Convention collective">
      <button type="button" id="cc51" aria-pressed="true">CCN 51<small>FEHAP · non lucratif</small></button>
      <button type="button" id="cc2264" aria-pressed="false">Privé lucratif<small>CCN 2264 · FHP/Synerpa</small></button>
    </div>
  </div>

  <div class="panel grid">
    <label class="full" for="brut">Brut de base mensuel (€)
      <input id="brut" inputmode="decimal" value="2700">
      <span class="hint" id="brutHint">coef 477 × 4,568 = 2 700</span>
    </label>
    <label for="anc">Ancienneté (ans)
      <input id="anc" inputmode="decimal" value="" placeholder="0">
      <span class="hint" id="ancHint"></span>
    </label>
    <label for="nbDim">Dimanches / mois
      <input id="nbDim" inputmode="decimal" value="2">
    </label>
    <label class="full" for="hDim">Heures par dimanche
      <input id="hDim" inputmode="decimal" value="10">
    </label>
  </div>

  <div class="nets">
    <div class="net main">
      <span class="k">Net × 0,77</span>
      <span class="v" id="n77">—</span>
      <span class="s">avec mutuelle</span>
    </div>
    <div class="net">
      <span class="k">Net × 0,78</span>
      <span class="v" id="n78">—</span>
      <span class="s">sans mutuelle · <span id="diff"></span></span>
    </div>
  </div>

  <div class="panel">
    <table>
      <tbody>
        <tr><td>Brut de base</td><td id="rBase">—</td></tr>
        <tr><td>Prime d'ancienneté<span class="d" id="rAncD"></span></td><td id="rAnc">—</td></tr>
        <tr><td>Complément Ségur<span class="d" id="rSegD"></span></td><td id="rSeg">—</td></tr>
        <tr><td>Indemnité dimanches<span class="d" id="rDimD"></span></td><td id="rDim">—</td></tr>
        <tr class="tot"><td>Brut total</td><td id="rTot">—</td></tr>
      </tbody>
    </table>
  </div>

  <div class="panel">
    <details>
      <summary>Paramètres de la convention</summary>
      <div class="grid">
        <label for="seg">Ségur (€ brut/mois)
          <input id="seg" inputmode="decimal">
        </label>
        <label for="dimH">Dimanche (€ brut/h)
          <input id="dimH" inputmode="decimal">
        </label>
        <label for="ancRate">Ancienneté (%/an)
          <input id="ancRate" inputmode="decimal">
        </label>
        <label for="ancCap">Plafond ancienneté (%)
          <input id="ancCap" inputmode="decimal">
        </label>
      </div>
      <button type="button" class="reset" id="reset">Revenir aux valeurs de la convention</button>
    </details>
  </div>

  <p class="note" id="note"></p>
</div>

<script>
const CC = {
  "51": {
    label:"CCN 51", seg:238, dimH:7.03, ancRate:1, ancCap:30,
    dimNote:"1,54 pt/h × 4,568 €",
    note:"CCN 51 : Ségur 238 € brut, indemnité dimanche 1,54 point CCN 51 par heure (valeur du point 4,568 € au 1er janvier 2026), ancienneté 1 %/an sur le salaire de base. La prime décentralisée (5 %) n'est pas incluse."
  },
  "2264": {
    label:"CCN 2264", seg:206, dimH:4.36, ancRate:1, ancCap:15,
    dimNote:"0,60 pt/h (≈ 4,36 €)",
    note:"Privé lucratif (CCN 2264) : Ségur 206 € brut, indemnité dimanche 0,60 point par heure (≈ 4,36 €, avenant 2023). Le barème d'ancienneté dépend de l'annexe et des accords du groupe : 1 %/an plafonné à 15 % par défaut, à ajuster selon le contrat."
  }
};
const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(String(v).replace(/\s/g,"").replace(",", ".")); return isNaN(n) ? 0 : n; };
const eur = n => n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const f2 = n => n.toLocaleString("fr-FR",{maximumFractionDigits:2});
let cc = "51";

function load(){
  try{ const s = JSON.parse(localStorage.getItem("brutnet-ide")||"null");
    if(s){ cc = s.cc||"51"; ["brut","anc","nbDim","hDim"].forEach(k=>{ if(s[k]!=null) $(k).value=s[k]; }); return s; } }catch(e){}
  return null;
}
function save(){
  try{ const s={cc}; ["brut","anc","nbDim","hDim","seg","dimH","ancRate","ancCap"].forEach(k=>s[k]=$(k).value);
    s.params = s.params||{}; localStorage.setItem("brutnet-ide", JSON.stringify(s)); }catch(e){}
}
function setParams(){
  const p = CC[cc];
  $("seg").value = f2(p.seg); $("dimH").value = f2(p.dimH);
  $("ancRate").value = f2(p.ancRate); $("ancCap").value = f2(p.ancCap);
}
function setCC(v, keepParams){
  cc = v;
  $("cc51").setAttribute("aria-pressed", v==="51");
  $("cc2264").setAttribute("aria-pressed", v==="2264");
  document.documentElement.classList.toggle("lucratif", v==="2264");
  $("fx").textContent = CC[v].label;
  $("brutHint").textContent = v==="51" ? "coef 477 × 4,568 = 2 700" : "salaire de base du contrat, hors Ségur";
  $("note").textContent = CC[v].note;
  if(!keepParams) setParams();
  calc();
}
function calc(){
  const brut = num($("brut").value), anc = num($("anc").value);
  const nb = num($("nbDim").value), h = num($("hDim").value);
  const seg = num($("seg").value), dimH = num($("dimH").value);
  const rate = num($("ancRate").value), cap = num($("ancCap").value);
  const pct = Math.min(anc*rate, cap);
  const primeAnc = brut*pct/100;
  const dim = nb*h*dimH;
  const tot = brut + primeAnc + seg + dim;
  $("rBase").textContent = eur(brut);
  $("rAnc").textContent = eur(primeAnc);
  $("rAncD").textContent = f2(pct) + " % du brut de base" + (anc*rate>cap ? " (plafond)" : "");
  $("ancHint").textContent = "→ " + f2(pct) + " %";
  $("rSeg").textContent = eur(seg);
  $("rSegD").textContent = "forfait temps plein";
  $("rDim").textContent = eur(dim);
  $("rDimD").textContent = f2(nb) + " × " + f2(h) + " h × " + f2(dimH) + " € · " + CC[cc].dimNote;
  $("rTot").textContent = eur(tot);
  const n77 = tot*0.77, n78 = tot*0.78;
  $("n77").textContent = eur(n77);
  $("n78").textContent = eur(n78);
  $("diff").textContent = "+" + eur(n78-n77);
  save();
}

const saved = load();
setCC(cc, false);
if(saved){ ["seg","dimH","ancRate","ancCap"].forEach(k=>{ if(saved[k]) $(k).value=saved[k]; }); calc(); }

$("cc51").addEventListener("click", ()=>setCC("51"));
$("cc2264").addEventListener("click", ()=>setCC("2264"));
$("reset").addEventListener("click", ()=>{ setParams(); calc(); });
document.querySelectorAll("input").forEach(i=>i.addEventListener("input", calc));
</script>
</body>
</html>
